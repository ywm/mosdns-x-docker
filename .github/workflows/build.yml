name: Build and Push mosdns-x from Source

on:
  # 每天点定时运行
  schedule:
    - cron: '0 18 * * *'
  # 手动触发（只有仓库协作者可以触发）
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    
    steps:
      # 安全检查：只允许特定用户手动触发
      - name: Security check for manual triggers
        if: github.event_name == 'workflow_dispatch'
        run: |
          # 设置允许手动触发的用户列表
          ALLOWED_USERS="ywm"  # 你的 GitHub 用户名
          
          TRIGGER_USER="${{ github.actor }}"
          
          if [[ ! "$ALLOWED_USERS" =~ (^|[[:space:]])"$TRIGGER_USER"($|[[:space:]]) ]]; then
            echo "❌ Error: User '$TRIGGER_USER' is not authorized to manually trigger this workflow."
            echo "Allowed users: $ALLOWED_USERS"
            exit 1
          fi
          
          echo "✅ User '$TRIGGER_USER' is authorized to trigger this workflow."

      # Checkout 仓库，使用自定义 GHTOKEN
      - name: Checkout this repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          token: ${{ secrets.GHTOKEN }}

      # 检查是否需要构建并获取 Go 版本
      - name: Determine if build is needed and get Go version
        id: check_build
        run: |
          # 获取 upstream 最新 commit hash
          LATEST_COMMIT=$(git ls-remote https://github.com/pmkol/mosdns-x.git HEAD | awk '{print $1}')
          echo "Latest upstream commit: $LATEST_COMMIT"
          
          # 从上游 go.mod 获取 Go 版本要求
          # 注意：go 指令是「最低要求」而不是上限，补丁版可以且应该用更新的
          GO_MIN=$(curl -sL https://raw.githubusercontent.com/pmkol/mosdns-x/main/go.mod | grep -E "^go [0-9]" | awk '{print $2}')
          
          # 如果获取失败，使用默认版本
          if [ -z "$GO_MIN" ]; then
            GO_MIN="1.25.5"
            echo "Warning: Could not fetch Go version from go.mod, using default: $GO_MIN"
          else
            echo "Upstream requires Go >= $GO_MIN"
          fi
          
          # 在同一 minor 线内取最新的补丁版（包含安全修复），而不是等上游升级 go.mod
          GO_MINOR=$(echo "$GO_MIN" | cut -d. -f1,2)
          GO_RELEASES=$(curl -sL "https://go.dev/dl/?mode=json&include=all" || true)
          GO_VERSION=$(echo "$GO_RELEASES" \
            | jq -r '.[] | select(.stable) | .version' 2>/dev/null \
            | grep -E "^go${GO_MINOR//./\\.}\." \
            | sed 's/^go//' \
            | sort -V | tail -1)
          
          if [ -z "$GO_VERSION" ]; then
            GO_VERSION="$GO_MIN"
            echo "Warning: Could not resolve latest patch of Go $GO_MINOR, falling back to $GO_VERSION"
          else
            echo "Resolved latest Go patch for minor $GO_MINOR: $GO_VERSION"
          fi
          
          # 取官方安装包的 sha256，构建阶段下载后校验（为空则跳过校验）
          GO_SHA256_AMD64=$(echo "$GO_RELEASES" \
            | jq -r --arg f "go${GO_VERSION}.linux-amd64.tar.gz" \
              '.[] | .files[]? | select(.filename == $f) | .sha256' 2>/dev/null | head -1)
          GO_SHA256_ARM64=$(echo "$GO_RELEASES" \
            | jq -r --arg f "go${GO_VERSION}.linux-arm64.tar.gz" \
              '.[] | .files[]? | select(.filename == $f) | .sha256' 2>/dev/null | head -1)
          
          if [ -z "$GO_SHA256_AMD64" ] || [ -z "$GO_SHA256_ARM64" ]; then
            echo "Warning: Could not resolve Go tarball checksums, build will skip verification"
          else
            echo "Go tarball checksums resolved"
          fi
          
          # 获取上游提交信息（标题）
          COMMIT_MESSAGE=$(curl -sL "https://api.github.com/repos/pmkol/mosdns-x/commits/${LATEST_COMMIT}" | grep -m 1 '"message":' | sed 's/.*"message": "\(.*\)",/\1/' | head -1)
          
          # 如果获取失败，使用默认信息
          if [ -z "$COMMIT_MESSAGE" ]; then
            COMMIT_MESSAGE="Update mosdns-x"
            echo "Warning: Could not fetch commit message, using default"
          else
            echo "Upstream commit message: $COMMIT_MESSAGE"
          fi
          
          # 判断是否需要构建：上游 commit 变化，或 Go 补丁版变化
          BUILD_NEEDED=false
          
          # 如果 version 文件不存在或为空，则需要构建
          if [ ! -f version ] || [ -z "$(cat version)" ]; then
            BUILD_NEEDED=true
          else
            CURRENT_COMMIT=$(cat version)
            [ "$CURRENT_COMMIT" != "$LATEST_COMMIT" ] && BUILD_NEEDED=true
          fi
          
          # 记录上次构建使用的 Go 版本，补丁升级（通常是安全修复）同样需要重新打包
          CURRENT_GO_VERSION=$(cat go-version 2>/dev/null || true)
          if [ "$CURRENT_GO_VERSION" != "$GO_VERSION" ]; then
            echo "Go version changed: '${CURRENT_GO_VERSION:-unknown}' -> '$GO_VERSION'"
            BUILD_NEEDED=true
          fi
          
          # 手动触发时强制构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger detected, forcing build..."
            BUILD_NEEDED=true
          fi
          
          # 保存用于 Docker tag 的 commit-hash + 日期
          SHORT_COMMIT=$(echo "$LATEST_COMMIT" | cut -c1-7)
          DOCKER_TAG="${SHORT_COMMIT}_$(date +'%Y%m%d')"
          
          echo "DOCKER_TAG=$DOCKER_TAG" >> $GITHUB_OUTPUT
          echo "build_needed=$BUILD_NEEDED" >> $GITHUB_OUTPUT
          echo "latest_commit=$LATEST_COMMIT" >> $GITHUB_OUTPUT
          echo "go_version=$GO_VERSION" >> $GITHUB_OUTPUT
          echo "go_sha256_amd64=$GO_SHA256_AMD64" >> $GITHUB_OUTPUT
          echo "go_sha256_arm64=$GO_SHA256_ARM64" >> $GITHUB_OUTPUT
          echo "commit_message=$COMMIT_MESSAGE" >> $GITHUB_OUTPUT

      # 如果不需要构建则退出
      - name: Exit if no build needed
        if: steps.check_build.outputs.build_needed == 'false'
        run: |
          echo "No build needed. Exiting workflow."
          exit 0

      # 启用 QEMU（必须，用于 arm64）
      - name: Set up QEMU
        if: steps.check_build.outputs.build_needed == 'true'
        uses: docker/setup-qemu-action@v4

      # 设置 Docker Buildx
      - name: Set up Docker Buildx
        if: steps.check_build.outputs.build_needed == 'true'
        uses: docker/setup-buildx-action@v4

      # 登录 GitHub Container Registry
      - name: Login to GitHub Container Registry
        if: steps.check_build.outputs.build_needed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHTOKEN }}

      # 登录 Docker Hub
      - name: Login to Docker Hub
        if: steps.check_build.outputs.build_needed == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # 构建并推送 Docker 镜像到两个 Registry（支持多架构）
      - name: Build and push Docker image
        if: steps.check_build.outputs.build_needed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MOSDNS_COMMIT=${{ steps.check_build.outputs.latest_commit }}
            GO_VERSION=${{ steps.check_build.outputs.go_version }}
            GO_SHA256_AMD64=${{ steps.check_build.outputs.go_sha256_amd64 }}
            GO_SHA256_ARM64=${{ steps.check_build.outputs.go_sha256_arm64 }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/mosdns-x-docker:${{ steps.check_build.outputs.DOCKER_TAG }}
            ghcr.io/${{ github.repository_owner }}/mosdns-x-docker:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/mosdns-x-docker:${{ steps.check_build.outputs.DOCKER_TAG }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/mosdns-x-docker:latest

      # 构建成功后更新 version 文件并推送到仓库
      - name: Update version file and commit
        if: steps.check_build.outputs.build_needed == 'true'
        run: |
          echo "${{ steps.check_build.outputs.latest_commit }}" > version
          echo "${{ steps.check_build.outputs.go_version }}" > go-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version go-version
          
          # 强制重建时版本可能没有变化，此时无需提交
          if git diff --cached --quiet; then
            echo "No version changes to commit."
            exit 0
          fi
          
          # 构造 commit message: 提交信息 - commit短hash - Go版本
          SHORT_COMMIT=$(echo "${{ steps.check_build.outputs.latest_commit }}" | cut -c1-7)
          git commit -m "${{ steps.check_build.outputs.commit_message }} - ${SHORT_COMMIT} - Go ${{ steps.check_build.outputs.go_version }}"
          
          git push https://x-access-token:${{ secrets.GHTOKEN }}@github.com/${{ github.repository_owner }}/mosdns-x-docker.git HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GHTOKEN }}
